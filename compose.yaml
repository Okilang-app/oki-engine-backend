x-oki-env: &oki-env
  OKI_ENVIRONMENT: ${OKI_ENVIRONMENT:-local}
  OKI_LOG_LEVEL: ${OKI_LOG_LEVEL:-INFO}
  OKI_DATABASE_URL: postgresql+asyncpg://oki:${POSTGRES_PASSWORD:-oki}@postgres:5432/oki
  OKI_VALKEY_URL: valkey://valkey:6379/0
  OKI_S3_ENDPOINT_URL: http://seaweedfs:8333
  OKI_S3_ACCESS_KEY: ${OKI_S3_ACCESS_KEY:-}
  OKI_S3_SECRET_KEY: ${OKI_S3_SECRET_KEY:-}
  OKI_S3_BUCKET: ${OKI_S3_BUCKET:-oki-local}
  OKI_KEYCLOAK_ISSUER: ${OKI_KEYCLOAK_ISSUER:-http://127.0.0.1:8080/realms/oki}
  OKI_KEYCLOAK_AUDIENCE: ${OKI_KEYCLOAK_AUDIENCE:-oki-api}
  OKI_KEYCLOAK_AUTHORIZED_PARTY: ${OKI_KEYCLOAK_AUTHORIZED_PARTY:-oki-web}
  OKI_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/oki/protocol/openid-connect/certs
  OKI_KEYCLOAK_JWKS_CACHE_SECONDS: ${OKI_KEYCLOAK_JWKS_CACHE_SECONDS:-300}
  OKI_KEYCLOAK_JWKS_TIMEOUT_SECONDS: ${OKI_KEYCLOAK_JWKS_TIMEOUT_SECONDS:-5}
  OKI_SENTRY_DSN: ${OKI_SENTRY_DSN:-}
  OKI_OPENAI_BASE_URL: ${OKI_OPENAI_BASE_URL:-}
  OKI_OPENAI_API_KEY: ${OKI_OPENAI_API_KEY:-}
  OKI_OPENAI_API_VERSION: ${OKI_OPENAI_API_VERSION:-2024-06-01}
  OKI_AZURE_OPENAI_ENDPOINT: ${OKI_AZURE_OPENAI_ENDPOINT:-}
  OKI_AZURE_OPENAI_API_KEY: ${OKI_AZURE_OPENAI_API_KEY:-}
  OKI_AZURE_WHISPER_DEPLOYMENT: ${OKI_AZURE_WHISPER_DEPLOYMENT:-whisper-1}
  OKI_AZURE_GPT_DEPLOYMENT: ${OKI_AZURE_GPT_DEPLOYMENT:-gpt-4}
  OKI_ELEVENLABS_API_KEY: ${OKI_ELEVENLABS_API_KEY:-}
  OKI_ELEVENLABS_BASE_URL: ${OKI_ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
  OKI_CLAMAV_HOST: clamav
  OKI_CLAMAV_PORT: 3310
  OKI_FFMPEG_PATH: ffmpeg
  OKI_FFPROBE_PATH: ffprobe

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oki}
      POSTGRES_USER: ${POSTGRES_USER:-oki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/001-oki-role.sql
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - valkey_data:/data
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${OKI_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OKI_S3_SECRET_KEY:-}
      S3_BUCKET: ${OKI_S3_BUCKET:-oki-local}
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-oki-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-localhost}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/oki-realm.json:/opt/keycloak/data/import/oki-realm.json:ro
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *oki-env
    ports:
      - "${OKI_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      <<: *oki-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  seaweedfs_data:
  keycloak_data:
  clamav_data:

configs:
  postgres_init:
    content: |
      CREATE ROLE oki_app NOLOGIN;
      COMMENT ON ROLE oki_app IS
        'Least-privilege Oki application role; login credentials are provisioned externally';
      GRANT USAGE ON SCHEMA public TO oki_app;
