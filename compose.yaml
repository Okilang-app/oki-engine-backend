services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oki}
      POSTGRES_USER: ${POSTGRES_USER:-oki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/001-oki-role.sql
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - valkey_data:/data
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${OKI_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OKI_S3_SECRET_KEY:-}
      S3_BUCKET: ${OKI_S3_BUCKET:-oki-local}
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-oki-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-localhost}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-1025}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/oki-realm.json:/opt/keycloak/data/import/oki-realm.json:ro
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  seaweedfs_data:
  keycloak_data:
  clamav_data:

configs:
  postgres_init:
    content: |
      CREATE ROLE oki_app NOLOGIN;
      COMMENT ON ROLE oki_app IS
        'Least-privilege Oki application role; login credentials are provisioned externally';
      GRANT USAGE ON SCHEMA public TO oki_app;
