x-oki-env: &oki-env
  OKI_ENVIRONMENT: production
  OKI_LOG_LEVEL: ${OKI_LOG_LEVEL:-INFO}
  OKI_DATABASE_URL: postgresql+asyncpg://oki:${POSTGRES_PASSWORD}@postgres:5432/oki
  OKI_VALKEY_URL: valkey://:${VALKEY_PASSWORD}@valkey:6379/0
  # Real AWS S3 — leave OKI_S3_ENDPOINT_URL empty so boto3 uses AWS directly
  OKI_S3_ENDPOINT_URL: ${OKI_S3_ENDPOINT_URL:-}
  OKI_S3_PUBLIC_URL: https://${OKI_S3_BUCKET}.s3.${AWS_REGION:-eu-central-1}.amazonaws.com
  OKI_S3_ACCESS_KEY: ${OKI_S3_ACCESS_KEY}
  OKI_S3_SECRET_KEY: ${OKI_S3_SECRET_KEY}
  OKI_S3_BUCKET: ${OKI_S3_BUCKET}
  OKI_KEYCLOAK_ISSUER: https://${AUTH_DOMAIN}/realms/oki
  OKI_KEYCLOAK_AUDIENCE: ${OKI_KEYCLOAK_AUDIENCE:-oki-api}
  OKI_KEYCLOAK_AUTHORIZED_PARTY: ${OKI_KEYCLOAK_AUTHORIZED_PARTY:-oki-web}
  OKI_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/oki/protocol/openid-connect/certs
  OKI_KEYCLOAK_JWKS_CACHE_SECONDS: 300
  OKI_KEYCLOAK_JWKS_TIMEOUT_SECONDS: 5
  OKI_SENTRY_DSN: ${OKI_SENTRY_DSN:-}
  OKI_OPENAI_BASE_URL: ${OKI_OPENAI_BASE_URL:-}
  OKI_OPENAI_API_KEY: ${OKI_OPENAI_API_KEY}
  OKI_OPENAI_API_VERSION: ${OKI_OPENAI_API_VERSION:-2024-06-01}
  OKI_AZURE_OPENAI_ENDPOINT: ${OKI_AZURE_OPENAI_ENDPOINT:-}
  OKI_AZURE_OPENAI_API_KEY: ${OKI_AZURE_OPENAI_API_KEY:-}
  OKI_AZURE_WHISPER_DEPLOYMENT: ${OKI_AZURE_WHISPER_DEPLOYMENT:-whisper-1}
  OKI_AZURE_GPT_DEPLOYMENT: ${OKI_AZURE_GPT_DEPLOYMENT:-gpt-4}
  OKI_ELEVENLABS_API_KEY: ${OKI_ELEVENLABS_API_KEY}
  OKI_ELEVENLABS_BASE_URL: ${OKI_ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
  OKI_CLAMAV_HOST: clamav
  OKI_CLAMAV_PORT: 3310
  OKI_FFMPEG_PATH: ffmpeg
  OKI_FFPROBE_PATH: ffprobe
  OKI_REVIEW_LINK_SECRET: ${OKI_REVIEW_LINK_SECRET}
  OKI_CORS_ORIGINS: ${OKI_CORS_ORIGINS:-https://oki-engine.vercel.app}

services:
  # ── Data layer ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: oki
      POSTGRES_USER: oki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oki -d oki"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - valkey_data:/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Auth ──────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      - start
      - --health-enabled=true
      - --import-realm
      - --hostname=https://${AUTH_DOMAIN}
      - --proxy-headers=xforwarded
      - --http-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/oki
      KC_DB_USERNAME: oki
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - ./deploy/keycloak/oki-realm.json:/opt/keycloak/data/import/oki-realm.json:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Security ──────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4.3
    platform: linux/amd64
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    volumes:
      - clamav_data:/var/lib/clamav
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  # ── Application ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: oki-api:latest
    environment:
      <<: *oki-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: oki-worker:latest
    environment:
      <<: *oki-env
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ── Reverse proxy + SSL ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    command: ["/bin/sh", "-c", "envsubst '$$API_DOMAIN $$AUTH_DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"]
    volumes:
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
  valkey_data:
  clamav_data:
