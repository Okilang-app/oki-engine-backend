[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oki-localization-backend"
version = "0.1.0"
description = "Oki Creator Localization Engine backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "authlib>=1.6,<2",
    "boto3>=1.39,<2",
    "valkey>=6.1,<7",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sentry-sdk[fastapi]>=2.34,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
    "hatchet-sdk>=1.37,<2",
    "opencv-python>=5.0.0.93",
    "openai>=3.1.0",
]

[dependency-groups]
test = [
    "httpx2>=2.10,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
]
type = [
    "boto3-stubs>=1.39,<2",
    "mypy>=1.17,<2",
]
lint = [
    "ruff>=0.12,<1",
]
dev = [
    { include-group = "test" },
    { include-group = "type" },
    { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/oki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oki"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
